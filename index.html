.fe-art{position:relative;width:220px;height:130px;margin-bottom:8px}
.fe-art span{position:absolute;width:44px;height:44px;border-radius:13px;display:grid;place-items:center;background:var(--fb);color:var(--fc);box-shadow:var(--sh-1);animation:feOrbit 6s ease-in-out infinite;animation-delay:calc(var(--i) * -1s)}
.fe-art span .ico{width:20px;height:20px}
.fe-art span:nth-child(1){left:6px;top:14px}.fe-art span:nth-child(2){left:52px;top:78px}.fe-art span:nth-child(3){right:52px;top:78px}
.fe-art span:nth-child(4){right:6px;top:14px}.fe-art span:nth-child(5){left:56px;top:0}.fe-art span:nth-child(6){right:56px;top:0}
.fe-art .fe-core{left:50%;top:44px;width:60px;height:60px;margin-left:-30px;border-radius:18px;background:linear-gradient(135deg,#3D63FF,#5A3FE6);color:#fff;box-shadow:0 14px 26px -10px rgba(61,99,255,.6);animation:hsFloat 4s ease-in-out infinite}
.fe-art .fe-core .ico{width:28px;height:28px}
@keyframes feOrbit{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-7px) scale(1.04)}}
/* section tabs */
/* file page */
.file-hero{display:flex;align-items:flex-start;gap:18px;padding:22px 24px;margin:4px 0 18px;background:var(--surface);border:1px solid var(--line);border-radius:18px;position:relative;overflow:hidden;isolation:isolate}
.file-hero::before{content:"";position:absolute;inset:0;z-index:-1;background:radial-gradient(420px 170px at 0% 0%,var(--fb),transparent 72%)}
.fh-ic{position:relative;flex:none;width:64px;height:64px;border-radius:18px;display:grid;place-items:center;background:var(--fb);color:var(--fc)}
.fh-ic .ico{width:28px;height:28px;stroke-width:1.6;margin-top:-8px}
.fh-ic b{position:absolute;bottom:7px;left:50%;transform:translateX(-50%);font:700 10px/1 var(--f-body);letter-spacing:.04em}

.fp-img{margin:auto;padding:24px;cursor:zoom-in;max-width:100%;overflow:auto}
.fp-img img{max-height:72vh;border-radius:8px;box-shadow:var(--sh-2);transition:transform .3s var(--ease)}
.fp-img.zoom{cursor:zoom-out}.fp-img.zoom img{max-height:none;max-width:none}
.fp-pdf{width:100%;height:80vh;border:0;display:block}
.fprev video{display:block;width:100%;max-height:76vh;background:#0B0F19}
.fp-audio{margin:auto;padding:40px 24px;display:flex;flex-direction:column;align-items:center;gap:16px;text-align:center}

.fp-audio audio{width:min(420px,100%)}
.fa-art{position:relative;width:108px;height:108px;border-radius:30px;display:grid;place-items:center;background:var(--fb);color:var(--fc)}

.fa-art i{position:absolute;inset:0;border-radius:30px;border:2px solid var(--fc);opacity:0}
.fa-art.on i{animation:ring 2.4s ease-out infinite}.fa-art.on i:nth-child(3){animation-delay:.8s}.fa-art.on i:nth-child(4){animation-delay:1.6s}
@keyframes ring{0%{transform:scale(1);opacity:.5}100%{transform:scale(1.6);opacity:0}}
.fp-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:8px 10px 8px 14px;border-bottom:1px solid var(--line2);background:#FAFBFC;font-size:12.5px;color:var(--muted)}
.fp-bar>.ico{width:15px;height:15px}
.fp-bar .btn{height:30px}
.fp-code{display:flex;max-height:78vh;overflow:auto;background:#fff;font:12.5px/1.65 var(--f-mono)}

.fp-src{flex:1;padding-left:16px!important;padding-right:20px!important;color:var(--ink);tab-size:4}

.fp-tablewrap{max-height:78vh;overflow:auto}
.fp-table{border-collapse:separate;border-spacing:0;font-size:13px;min-width:100%}

.fp-table th,.fp-table td{padding:8px 12px;white-space:nowrap;border-bottom:1px solid var(--line2);max-width:340px;overflow:hidden;text-overflow:ellipsis}
.fp-table td:first-child,.fp-table th:first-child{color:var(--faint);font-variant-numeric:tabular-nums;position:sticky;left:0;background:#FAFBFC}

.np{margin:auto;padding:46px 24px;display:flex;flex-direction:column;align-items:center;text-align:center;max-width:460px}

.np-art .ico{width:46px;height:46px;stroke-width:1.4;margin-top:-14px}
.np-art span{position:absolute;bottom:16px;font:700 12px var(--f-body);letter-spacing:.04em}
.np-art.err{--fb:#FEF3F2;--fc:#D92D20;height:96px;width:96px}.np-art.err .ico{margin:0}

@media (max-width:1180px){.file-layout{grid-template-columns:minmax(0,1fr)}.file-info{position:static}}
@media (max-width:1100px){.ft-head,.ft-row{grid-template-columns:minmax(0,1fr) 120px 84px 110px 118px}.ft-sec{display:none}.ftable.no-sec .ft-head,.ftable.no-sec .ft-row{grid-template-columns:minmax(0,1fr) 120px 84px 110px 118px}}

html{-webkit-tap-highlight-color:transparent}

@keyframes toastDown{to{opacity:0;transform:translateY(16px)}}
@media (max-width:760px){.toast.out{animation:toastDown .24s ease forwards}}
@media (max-width:760px){.overlay .dialog{animation:sheetIn .32s var(--ease)}}
/* very small phones */
@media (max-width:380px){
  .topbar{gap:4px;padding:0 8px}
  .top-actions{gap:0}
  .icon-btn{width:34px;height:34px}
  .avatar{width:32px;height:32px}
  .hero-title{font-size:28px}
  .stat{padding:14px 12px}
  .stat-value{font-size:23px}
  .vh-tools .btn-sm{padding:0 7px}
  .vh-tools [data-act=find]{display:none}
  .icon-grid{grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
}
/* short landscape screens (phones turned sideways) */
@media (max-height:520px) and (orientation:landscape){
  .overlay{align-items:center}
  .dialog,.dialog.wide,.dialog.xwide{max-height:calc(100dvh - 16px)}
  .splash-mark{width:48px;height:48px}
  .editor{height:auto;min-height:0}
  .editor textarea{min-height:60vh}
}

/* =========================================================
   v3: one Documents / Files switch, tree sidebar, pickers, write flow
   ========================================================= */
/* the switch */
.mode-sw{position:relative;display:inline-grid;grid-template-columns:1fr 1fr;padding:3px;border-radius:12px;background:var(--sunk);box-shadow:inset 0 0 0 1px rgba(16,24,40,.04);flex:none;isolation:isolate;vertical-align:middle}
.mode-sw button{position:relative;z-index:1;display:inline-flex;align-items:center;justify-content:center;gap:7px;height:34px;padding:0 14px;border-radius:9px;font-weight:600;font-size:13px;color:var(--muted);transition:color .3s;white-space:nowrap}
.mode-sw button[data-mode=docs]{--mc:var(--blue)}.mode-sw button[data-mode=files]{--mc:#0B9DB5}
.mode-sw button .ico{width:16px;height:16px;transition:color .3s}
.mode-sw button:hover{color:var(--ink)}
.mode-sw button[aria-selected=true]{color:var(--ink)}
.mode-sw button[aria-selected=true] .ico{color:var(--mc);animation:msIco .55s var(--ease)}
@keyframes msIco{0%{transform:scale(.7) rotate(-12deg)}60%{transform:scale(1.15) rotate(4deg)}100%{transform:none}}
.ms-thumb{position:absolute;z-index:0;top:3px;bottom:3px;left:3px;width:calc(50% - 3px);border-radius:9px;background:#fff;box-shadow:0 1px 2px rgba(16,24,40,.06),0 6px 14px -6px rgba(16,24,40,.18);transition:transform .5s cubic-bezier(.34,1.4,.5,1)}
.ms-thumb.r{transform:translateX(100%)}
.ms-n{font-size:11px;line-height:18px;padding:0 7px;border-radius:99px;background:rgba(16,24,40,.06);font-variant-numeric:tabular-nums;transition:background .3s,color .3s}
.mode-sw button[aria-selected=true] .ms-n{background:color-mix(in srgb,var(--mc) 12%,#fff);color:var(--mc)}
.hero-mode{position:absolute;top:-8px;left:4px;z-index:3}
.hero-mode button{height:30px;padding:0 12px;font-size:12.5px}
.page-actions .mode-sw{margin-left:4px}
.crumb-bar{display:flex;align-items:center;justify-content:space-between;gap:10px 14px;flex-wrap:wrap;margin:0 0 14px}
.crumb-bar .crumbs{margin:0;min-width:0}
/* switching between documents and files */
.view.mode-in>*:not(.page-head):not(.hero):not(.crumb-bar){animation:modeIn .55s var(--ease) both}
.view.mode-in>*:nth-child(2){animation-delay:40ms}.view.mode-in>*:nth-child(3){animation-delay:90ms}.view.mode-in>*:nth-child(4){animation-delay:140ms}.view.mode-in>*:nth-child(n+5){animation-delay:180ms}
.view.mode-in .hero-title .ln span{animation:none}
.view.mode-in .hero-copy{animation:copyIn .6s var(--ease) both}
@keyframes modeIn{from{opacity:0;transform:translateY(10px);filter:blur(4px)}}
@keyframes copyIn{from{opacity:0;filter:blur(5px);transform:translateY(4px)}}
/* animated word swap */
.morph{display:inline-block;position:relative;vertical-align:top;white-space:nowrap}
.morph.run{transition:width .55s cubic-bezier(.3,1.25,.5,1)}
.morph .mw{display:inline-block;white-space:nowrap}
.morph .mw.out{position:absolute;left:0;top:0}
.morph .mw i{display:inline-block;font-style:normal}
.morph .mw.out i{animation:mwOut .36s var(--ease) both}
.morph .mw.in i{animation:mwIn .55s cubic-bezier(.2,1.2,.3,1) both}
@keyframes mwOut{to{opacity:0;transform:translateY(-60%);filter:blur(3px)}}
@keyframes mwIn{from{opacity:0;transform:translateY(70%);filter:blur(3px)}}
.up-morph>span{display:inline-flex;gap:.28em}
.up-morph .morph{color:var(--blue)}
.hero[data-mode=files] .up-morph .morph{color:#0B9DB5}

/* sidebar tree: sections, modules and sub-modules */
#secList{padding-bottom:6px}
.tree-node{position:relative}
.sec-row .nav-item{padding:0 8px 0 6px;gap:10px}
.sec-row .sec-dot{width:26px;height:26px;border-radius:8px;box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--c) 14%,transparent)}
.sec-row .lbl{flex:0 1 auto;min-width:0}
.sec-row .tw{width:20px;height:20px;margin-left:-5px;border-radius:6px;display:grid;place-items:center;color:var(--faint);flex:none;transition:transform .32s var(--ease),background .15s,color .15s}
.sec-row .tw .ico{width:14px;height:14px;stroke-width:2.2}
.tree-node.open>.sec-row .tw{transform:rotate(90deg)}
.sec-row .tw:hover{background:rgba(16,24,40,.07);color:var(--ink)}
.sec-row .count{min-width:22px;height:20px;padding:0 6px;border-radius:99px;display:grid;place-items:center;background:var(--sunk);font-size:11px;font-weight:600;color:var(--muted);margin-left:0}
.sec-row .nav-item.active .count{background:#fff;color:var(--c)}
.tree-kids{display:grid;grid-template-rows:0fr;transition:grid-template-rows .36s var(--ease)}
.tree-node.open>.tree-kids{grid-template-rows:1fr}
.tk-in{min-height:0;overflow:hidden;position:relative;margin-left:18px;padding-left:14px}
.tk-in>.tree-node::before{content:"";position:absolute;left:-14px;top:0;bottom:0;border-left:1.5px solid var(--line)}
.tk-in>.tree-node:last-child::before{display:none}
.tk-in>.tree-node>.sec-row::before{content:"";position:absolute;left:-14px;top:0;width:10px;height:50%;border-left:1.5px solid var(--line);border-bottom:1.5px solid var(--line);border-bottom-left-radius:8px;transition:border-color .25s}
.tk-in>.tree-node.cur>.sec-row::before,.tk-in>.tree-node>.sec-row:hover::before{border-color:var(--c)}
.tk-in .sec-row .nav-item{height:34px;font-size:13.5px;gap:9px}
.tk-in .sec-row .sec-dot{width:22px;height:22px;border-radius:7px}
.tk-in .sec-row .sec-dot .ico{width:13px;height:13px}
.tk-in .sec-row .more{top:3px}
.tree-node.opening>.tree-kids>.tk-in>.tree-node{animation:kidIn .4s var(--ease) both}
.tree-node.opening>.tree-kids>.tk-in>.tree-node:nth-child(2){animation-delay:40ms}.tree-node.opening>.tree-kids>.tk-in>.tree-node:nth-child(3){animation-delay:80ms}.tree-node.opening>.tree-kids>.tk-in>.tree-node:nth-child(n+4){animation-delay:120ms}
@keyframes kidIn{from{opacity:0;transform:translateX(-8px)}}
.nav-new{color:var(--blue)}
.sec-row .nav-item.active::before{display:none}
.sec-row .nav-item.active{background:var(--soft);color:var(--ink);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--c) 16%,transparent)}
.sec-row .nav-item.active .lbl{font-weight:600}
.tk-in>.tree-node.cur>.sec-row::before{border-color:var(--c)}
.tree-node.cur>.tree-kids>.tk-in>.tree-node::before,.tree-node.cur>.tree-kids>.tk-in>.tree-node>.sec-row::before{border-color:color-mix(in srgb,var(--c) 35%,var(--line))}
@media (max-width:1100px) and (min-width:761px){.tree-kids,.sec-row .tw,.sec-row .grow{display:none}.sec-row .nav-item{padding:0;justify-content:center}}

/* rows that hold files */
.row .row-fic{width:32px;height:34px;border-radius:9px}
.rows.compact .row-fic{width:28px;height:30px;border-radius:8px}
.row .row-fic .ico{width:15px;height:15px;margin-top:-7px}
.row .row-fic b{font-size:6.5px;bottom:3px}
.row.is-file:hover .row-fic{transform:rotate(-4deg) scale(1.05)}
.pf-ic{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;background:var(--fb);color:var(--fc);margin-right:8px;flex:none}
.pf-ic .ico{width:15px;height:15px}

/* location picker */
.pick{position:relative}
.pick-btn{width:100%;min-height:46px;display:flex;align-items:center;gap:10px;padding:6px 10px 6px 8px;border:1px solid var(--line);border-radius:11px;background:#fff;text-align:left;transition:border-color .18s,box-shadow .18s,background .18s}
.pick-btn:hover{border-color:#C9D0DB;background:#FCFCFD}
.pick.open .pick-btn,.pick-btn:focus-visible{outline:none;border-color:#A9B9FF;box-shadow:0 0 0 4px rgba(46,91,255,.12)}
.pick-face{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.pick-face .sec-dot,.po .sec-dot{width:30px;height:30px;border-radius:9px}
.pick-face .sec-dot .ico,.po .sec-dot .ico{width:16px;height:16px}
.sec-dot.root{--c:var(--ink2);--soft:var(--sunk);background:linear-gradient(135deg,#F4F6F9,#E9EDF3);color:var(--ink2)}
.pf-t,.po-t{display:flex;flex-direction:column;min-width:0;flex:1;line-height:1.25}
.pf-t b,.po-t b{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pf-t small,.po-t small{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pick-chev{margin-left:auto;color:var(--faint);display:grid;transition:color .2s}
.pick-chev .ico{width:16px;height:16px}
.pick.open .pick-chev{color:var(--blue)}
.pick-btn.pop .sec-dot{animation:icoPop .5s var(--ease)}
.pick-list{position:absolute;left:0;right:0;top:calc(100% + 6px);z-index:30;max-height:290px;overflow:auto;padding:6px;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:var(--sh-3);animation:pickIn .2s var(--ease);transform-origin:top center;scrollbar-width:thin}
.pick-list.ported{position:fixed;right:auto;z-index:120}
.pick-list.up{transform-origin:bottom center}
@keyframes pickIn{from{opacity:0;transform:translateY(-4px) scale(.98)}}
.po{position:relative;width:100%;display:flex;align-items:center;gap:10px;min-height:42px;padding:5px 10px 5px calc(8px + var(--depth,0) * 22px);border-radius:9px;text-align:left;transition:background .14s}
.po+.po{margin-top:1px}
.po:hover,.po:focus{background:var(--sunk);outline:none}
.po .sec-dot{width:28px;height:28px;border-radius:8px}
.po .sec-dot .ico{width:15px;height:15px}
.po-t b{font-size:13.5px}
.po-ok{display:grid;color:var(--blue);opacity:0;transform:scale(.5);transition:opacity .2s,transform .25s var(--ease)}
.po-ok .ico{width:16px;height:16px;stroke-width:2.4}
.po[aria-selected=true]{background:var(--blue-soft)}
.po[aria-selected=true] .po-t b{color:var(--blue)}
.po[aria-selected=true] .po-ok{opacity:1;transform:none}
.po-elbow{position:absolute;left:calc(8px + (var(--depth) - 1) * 22px + 13px);top:-1px;width:9px;height:calc(50% + 1px);border-left:1.5px solid var(--line);border-bottom:1.5px solid var(--line);border-bottom-left-radius:7px}
.po-sep{font-size:11px;font-weight:600;color:var(--faint);text-transform:uppercase;letter-spacing:.07em;padding:10px 10px 5px;border-top:1px solid var(--line2);margin-top:5px}

/* compact create-section dialog */
.dialog.sm-dlg{width:min(480px,100%)}
.sm-ident{display:flex;align-items:flex-end;gap:12px;margin-bottom:15px}
.sm-ident .field{flex:1;margin-bottom:0;min-width:0}
.sm-ident .input{height:46px;font-size:15px}
.sm-ib{position:relative;width:46px;height:46px;flex:none;border-radius:13px;display:grid;place-items:center;background:var(--soft,#EEF2FF);color:var(--c,var(--blue));border:1px solid color-mix(in srgb,var(--c,#2E5BFF) 24%,transparent);transition:transform .2s var(--ease),box-shadow .25s,background .3s,color .3s}
.sm-ib:hover{transform:translateY(-1px);box-shadow:0 10px 20px -12px var(--c)}
.sm-ib.on{box-shadow:0 0 0 3px #fff,0 0 0 5px var(--c)}
.sm-ib-i{display:grid}
.sm-ib-i .ico{width:22px;height:22px}
.sm-ib-i.pop{animation:icoPop .6s var(--ease)}
.sm-ib-b{position:absolute;right:-6px;bottom:-6px;width:21px;height:21px;border-radius:50%;display:grid;place-items:center;background:#fff;color:var(--ink2);box-shadow:0 1px 3px rgba(16,24,40,.2),0 0 0 1px rgba(16,24,40,.05);transition:transform .2s var(--ease)}
.sm-ib-b .ico{width:11px;height:11px;stroke-width:2.2}
.sm-ib:hover .sm-ib-b{transform:scale(1.12) rotate(-8deg)}
.icon-panel{display:grid;grid-template-rows:0fr;transition:grid-template-rows .38s var(--ease),margin .38s var(--ease);margin:0}
.icon-panel.open{grid-template-rows:1fr;margin:-3px 0 16px}
.ip-in{min-height:0;overflow:hidden;border-radius:14px;background:#FAFBFC;box-shadow:inset 0 0 0 1px var(--line)}
.ip-head{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;font-weight:600;color:var(--ink2);padding:11px 14px 8px}
.ip-name{color:var(--c);font-weight:600}
.icon-panel .icon-grid{grid-template-columns:repeat(9,minmax(0,1fr));gap:6px;padding:0 12px 12px}
.icon-panel .icon-opt{border-radius:10px}
.icon-panel .icon-opt .ico{width:19px;height:19px}
.icon-panel .icon-opt::after{display:none}
.icon-panel.open .icon-opt{animation:ipIn .35s var(--ease) both;animation-delay:calc(var(--i,0) * 14ms)}
@keyframes ipIn{from{opacity:0;transform:scale(.7)}}
.st-link{display:inline-flex;align-items:center;gap:6px;color:var(--blue)!important;font-weight:600;font-size:13px!important}
.st-link .ico{width:15px;height:15px}
@media (max-width:560px){.icon-panel .icon-grid{grid-template-columns:repeat(6,minmax(0,1fr))}}

/* write new */
.wc-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.wc-lead{font-size:13px;color:var(--muted);margin:-2px 0 12px}
.wcard{position:relative;display:flex;flex-direction:column;gap:16px;padding:18px 16px 16px;border:1px solid var(--line);border-radius:16px;background:#fff;text-align:left;overflow:hidden;transition:transform .28s var(--ease),box-shadow .28s,border-color .2s}
.wcard::before{content:"";position:absolute;inset:0;background:radial-gradient(260px 150px at 0% 0%,var(--soft),transparent 72%);pointer-events:none}
.wcard:hover,.wcard:focus-visible{transform:translateY(-3px);border-color:color-mix(in srgb,var(--c) 40%,var(--line));box-shadow:0 20px 36px -22px color-mix(in srgb,var(--c) 65%,transparent);outline:none}
.wc-art{position:relative;width:52px;height:60px}
.wc-pg{position:absolute;inset:0;border-radius:10px;background:#fff;border:1.5px solid color-mix(in srgb,var(--c) 30%,var(--line));padding:13px 9px 0;display:flex;flex-direction:column;gap:5px;transition:transform .4s var(--ease)}
.wc-pg i{height:4px;border-radius:3px;background:color-mix(in srgb,var(--c) 18%,#EEF0F3);transform-origin:left}
.wc-pg i:nth-child(2){width:78%}.wc-pg i:nth-child(3){width:56%}
.wcard:hover .wc-pg,.wcard:focus-visible .wc-pg{transform:rotate(-5deg) translateY(-2px)}
.wcard:hover .wc-pg i,.wcard:focus-visible .wc-pg i{animation:typeLn .9s var(--ease) both}
.wcard:hover .wc-pg i:nth-child(2){animation-delay:.12s}.wcard:hover .wc-pg i:nth-child(3){animation-delay:.24s}
@keyframes typeLn{from{transform:scaleX(0)}}
.wc-art b{position:absolute;left:-7px;bottom:7px;padding:3px 7px;border-radius:6px;background:var(--c);color:#fff;font:700 10.5px var(--f-body);letter-spacing:.05em;box-shadow:0 6px 12px -6px var(--c)}
.wc-t{position:relative;display:flex;flex-direction:column;gap:4px}
.wc-t b{font:600 16px var(--f-head)}
.wc-t span{font-size:13px;color:var(--muted);line-height:1.5}
.wc-go{position:absolute;right:14px;top:16px;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--sunk);color:var(--ink2);transition:all .28s var(--ease)}
.wc-go .ico{width:16px;height:16px}
.wcard:hover .wc-go,.wcard:focus-visible .wc-go{background:var(--c);color:#fff;transform:translateX(3px)}
.editor.solo{grid-template-columns:minmax(0,1fr);max-width:980px;margin:0 auto}
.ed-src{display:flex;flex-direction:column;min-height:0;height:100%;border:1px solid var(--line);border-radius:16px;background:#fff;overflow:hidden;transition:border-color .2s,box-shadow .2s}
.ed-src:focus-within{border-color:#A9B9FF;box-shadow:0 0 0 4px rgba(46,91,255,.1)}
.editor .ed-src textarea{flex:1;height:auto;min-height:0;border:0;border-radius:0;box-shadow:none;padding:18px 20px;font:13.5px/1.75 var(--f-mono)}
.editor .ed-src textarea:focus{box-shadow:none}
.editor.solo .ed-src textarea{font:15px/1.8 var(--f-body);padding:26px 30px;color:var(--ink)}
.md-tools{display:flex;align-items:center;gap:2px;padding:6px 8px;border-bottom:1px solid var(--line2);background:#FCFCFD;flex-wrap:wrap}
.md-tools .icon-btn{color:var(--muted)}
.md-tools .icon-btn:hover{color:var(--ink)}
.mt-sep{width:1px;height:18px;background:var(--line);margin:0 4px}
.ed-foot{display:flex;gap:16px;padding:8px 16px;border-top:1px solid var(--line2);font-size:12px;color:var(--muted);background:#FCFCFD;font-variant-numeric:tabular-nums}
.editor.write .paper{position:relative}
.prev-empty{position:absolute;inset:0;display:grid;place-content:center;justify-items:center;gap:8px;color:var(--faint);font-size:13px;pointer-events:none;background:#fff;border-radius:inherit;animation:fadeIn .3s}
.prev-empty .ico{width:28px;height:28px;stroke-width:1.5}
.write-head .ed-status{color:var(--amber)}
.name-ext{display:flex;align-items:stretch}
.name-ext .input{border-top-right-radius:0;border-bottom-right-radius:0;min-width:0}
.name-ext span{display:grid;place-items:center;padding:0 12px;border:1px solid var(--line);border-left:0;border-radius:0 10px 10px 0;background:var(--sunk);color:var(--muted);font:600 13px var(--f-mono)}
.field.err .name-ext .input{border-color:var(--red)}

/* account menu */
.menu:focus{outline:none}
.acct-menu{min-width:276px;padding:8px}
.acct-menu .menu-head{padding:8px 8px 12px;gap:12px}
.avatar.lg{width:44px;height:44px;font-size:15px;background:linear-gradient(135deg,#2E5BFF,#7357FF);box-shadow:0 8px 16px -8px rgba(46,91,255,.7)}
.mh-t{min-width:0}
.mh-t b{font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mh-t>span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.menu-head .mh-role{display:inline-block;margin-top:5px;font-size:11px;font-weight:600;padding:1px 8px;border-radius:99px;background:var(--sunk);color:var(--ink2)}
.mh-plan{display:grid;grid-template-columns:auto 1fr;align-items:center;gap:6px 8px;margin:0 4px 8px;padding:10px 12px;border-radius:11px;background:var(--sunk);font-size:12px;color:var(--ink2)}
.mh-plan .ico{width:15px;height:15px;color:var(--cyan)}
.mh-plan i{grid-column:1/-1;height:5px;border-radius:5px;background:linear-gradient(90deg,var(--cyan),var(--blue)) 0 0/var(--p) 100% no-repeat,#E4E8EF}
.acct-menu .m-item{height:38px}
#avatarBtn{background:linear-gradient(135deg,#1F2937,#3B4558);transition:transform .2s var(--ease),box-shadow .2s}
#avatarBtn:hover{transform:scale(1.06)}
#avatarBtn[aria-expanded=true]{box-shadow:0 0 0 3px #fff,0 0 0 5px var(--blue)}

/* author chip on shared documents */
.meta-strip .av{display:grid}
.av.xs{width:22px;height:22px;border-radius:50%;font-size:9.5px;letter-spacing:0;line-height:1}
.meta-strip .by-link{padding:3px 11px 3px 3px;border-radius:99px;background:#fff;border:1px solid var(--line);box-shadow:var(--sh-1);gap:7px;transition:border-color .2s,box-shadow .2s}
.meta-strip .by-link:hover{border-color:#C9D0DB;box-shadow:0 6px 14px -8px rgba(16,24,40,.25)}

@media (max-width:760px){
  .page-actions .mode-sw{order:-1;flex:1 1 100%;margin:0}
  .crumb-bar .mode-sw{flex:1 1 100%;order:2}
  .mode-sw button{height:36px}
  .hero-mode{position:relative;top:0;left:0;display:grid;width:max-content;margin:6px 0 4px}
  .editor.show-prev .ed-src,.editor.write:not(.show-prev) .paper{display:none}
  .editor.solo .ed-src textarea{padding:18px}
  .wc-grid{grid-template-columns:minmax(0,1fr)}
  .wcard{flex-direction:row;align-items:center;gap:14px;padding:14px}
  .wc-art{width:44px;height:52px;flex:none}
  .wc-go{position:static;margin-left:auto;flex:none}
  .icon-panel .icon-grid{grid-template-columns:repeat(6,minmax(0,1fr))}
}

function mdInline(s) {

function md(src) {

  while (i < lines.length) {
    const l = lines[i];
    if (/^```/.test(l)) {
      flush(); const lang = l.slice(3).trim(); const buf = []; i++;

    }

    if (/^\s*\d+[.)]\s+/.test(l)) { flush(); out += '<ol>'; while (i < lines.length && /^\s*\d+[.)]\s+/.test(lines[i])) out += `<li>${mdInline(lines[i++].replace(/^\s*\d+[.)]\s+/, ''))}</li>`; out += '</ol>\n'; continue; }

    }

  return out;
}

const bg = (() => {

    $$('.hs-layer', wrap).forEach(l => { const d = +l.dataset.depth; l.style.transform = `translate(${(px * d).toFixed(1)}px,${(py * d).toFixed(1)}px)`; });

        close();

      };
      go_.addEventListener('click', submit);

      if (mode === 'upload' && !file) setTimeout(() => drop.focus(), 40);
    }
  });

const qIn = $('#q'), resBox = $('#results');
let resItems = [], resIdx = -1;

function searchAll(q) {
  const ql = q.toLowerCase().trim(); if (!ql) return null;
  const docs = liveAll().map(d => {
    const s = secById(d.sectionId), nm = d.name.toLowerCase(); let score = 0, snippet = '';
    if (isFile(d) && ql.replace(/^\*?\./, '') === (d.ext || '') && /^\*?\./.test(ql)) score += 90;
    if (nm.startsWith(ql)) score += 100; else if (nm.includes(ql)) score += 70;
    if (d.tags.some(t => t.toLowerCase() === ql)) score += 60; else if (d.tags.some(t => t.toLowerCase().includes(ql))) score += 35;
    if ((d.description || '').toLowerCase().includes(ql)) score += 25;
    if (s && s.name.toLowerCase().includes(ql)) score += 15;
    const tx = textOf(d), k = tx.low.indexOf(ql);
    if (k >= 0) { score += 8; if (score <= 23) snippet = (k > 30 ? '…' : '') + tx.raw.slice(Math.max(0, k - 30), k + ql.length + 60).trim() + '…'; }
    return { d, s, score, snippet };
  }).filter(x => x.score).sort((a, b) => b.score - a.score || b.d.updatedAt - a.d.updatedAt);
  const secs = sections().filter(s => s.name.toLowerCase().includes(ql) || (s.description || '').toLowerCase().includes(ql));
  const tags = allTags().filter(([t]) => t.toLowerCase().includes(ql)).slice(0, 8);
  return { docs: docs.filter(x => !isFile(x.d)), files: docs.filter(x => isFile(x.d)), secs, tags };
}
function showResults() {

  if (r.docs.length) {
    h += '<div class="res-group">Documents</div>' + r.docs.slice(0, 6).map(x => add('/doc/' + x.d.id, `${glyph(x.d)}<div class="res-main"><div class="res-name">${hl(x.d.name, q)}</div><div class="res-sub">${x.snippet ? hl(x.snippet, q) : esc(x.s ? x.s.name : 'Unsorted') + (x.d.tags.length ? ', ' + x.d.tags.slice(0, 3).map(t => hl(t, q)).join(', ') : '')}</div></div>`)).join('');
  }

  }
  if (r.secs.length) {
    h += '<div class="res-group">Sections</div>' + r.secs.slice(0, 4).map(s => add('/section/' + encodeURIComponent(s.id), `<span class="sec-dot" style="${secVars(s)}">${ico(s.icon)}</span><div class="res-main"><div class="res-name">${hl(s.name, q)}</div><div class="res-sub">${esc(depthOf(s.id) ? pathLabel(s.id) : 'Section')}, ${plural(deepDocs(s.id).length, 'document')}</div></div>`)).join('');
  }

    h += '<div class="res-group">Tags</div>' + r.tags.map(([t, n]) => add('/documents?tag=' + encodeURIComponent(t), `<span class="sec-dot" style="--c:#2E5BFF;--soft:#EEF2FF">${ico('tag')}</span><div class="res-main"><div class="res-name">${hl(t, q)}</div><div class="res-sub">${plural(n, 'document')}</div></div>`)).join('');
  }
  if (!resItems.length) h = `<div class="res-empty">No results for “${esc(q.trim())}”. Try a tag like PWM, a section name, or a file extension like .step.</div>`;
  h += `<div class="res-foot"><span><kbd>↑</kbd> <kbd>↓</kbd> move</span><span><kbd>Enter</kbd> open</span><span><kbd>Esc</kbd> close</span>${r.docs.length > 6 ? `<span style="margin-left:auto">${r.docs.length} documents match. Press Enter to see all.</span>` : ''}</div>`;
  resBox.innerHTML = h; resBox.hidden = false; qIn.setAttribute('aria-expanded', 'true'); resIdx = -1;
}
function setRes(i) {

let dragSid = null;
const nav = $('#nav');
const clearDrop = () => $$('.sec-row', nav).forEach(r => r.classList.remove('drop-before', 'drop-after'));
nav.addEventListener('dragstart', e => {
  const row = e.target.closest && e.target.closest('.sec-row'); if (!row) return;
  dragSid = row.dataset.sid; e.dataTransfer.effectAllowed = 'move';
  try { e.dataTransfer.setData('text/x-ds-section', dragSid); } catch (err) { /* noop */ }
  row.classList.add('dragging');
});
nav.addEventListener('dragover', e => {
  if (!dragSid) return; const row = e.target.closest('.sec-row'); if (!row || row.dataset.sid === dragSid) return;
  e.preventDefault(); clearDrop();
  const r = row.getBoundingClientRect(); row.classList.add(e.clientY < r.top + r.height / 2 ? 'drop-before' : 'drop-after');
});
nav.addEventListener('drop', e => {
  if (!dragSid) return; e.preventDefault();

  const after = row.classList.contains('drop-after');
  const dragged = secById(dragSid), pid = isRoot(dragged) ? null : dragged.parentId;
  if ((row.dataset.pid || null) !== (pid || null)) { clearDrop(); dragSid = null; toast('Drag within the same level. To change where it lives, use Move to… in its menu.', { type: 'info', ms: 4200 }); return; }
  const list = siblingsOf(pid).filter(s => s.id !== dragSid);
  const idx = list.findIndex(s => s.id === row.dataset.sid) + (after ? 1 : 0);
  list.splice(idx, 0, secById(dragSid));
  const id = dragSid; dragSid = null; saveOrder(list).then(() => flashSection(id));
});

addEventListener('drop', e => {

    if (up && !nm.value.trim()) { setFieldErr(root, 'afName', 'Enter your name.'); bad = true; }
    if (!emailOk(email)) { setFieldErr(root, 'afEmail', 'Enter a valid email address.'); bad = true; }
    else if (!domainOk(email)) { setFieldErr(root, 'afEmail', `Use your work email (${esc(domainHint())}).`); bad = true; }
    if (up ? pass.length < 8 : !pass) { setFieldErr(root, 'afPw', up ? 'Use at least 8 characters.' : 'Enter your password.'); bad = true; }
    if (bad) return;
    const btn = $('#aSubmit'); btn.classList.add('loading');
    try {
      if (remember) { localStorage.removeItem('docbox.ephemeral'); } else { localStorage.setItem('docbox.ephemeral', '1'); sessionStorage.setItem('docbox.alive', '1'); }
    } catch (x) { /* noop */ }
    if (up) {
      const { data, error } = await sb.auth.signUp({ email, password: pass, options: { data: { full_name: nm.value.trim() } } });
      if (error) { btn.classList.remove('loading'); authAlert(/already registered/i.test(error.message) ? 'An account with this email already exists. <button type="button" class="txt-btn" data-auth="to-signin">Sign in instead</button>' : esc(authErr(error))); return; }
      if (!data.session) {
        const r = await sb.auth.signInWithPassword({ email, password: pass });
        btn.classList.remove('loading');
        if (r.error) authAlert(/not confirmed/i.test(r.error.message) ? 'Your account was created, but email confirmation is still switched on in Supabase. The administrator needs to turn off <b>Confirm email</b> (Authentication &gt; Sign In / Providers &gt; Email) and confirm this account, then you can sign in.' : esc(authErr(r.error)));
      }
      return;
    }
    const { error } = await sb.auth.signInWithPassword({ email, password: pass });
    if (error) { btn.classList.remove('loading'); authAlert(esc(authErr(error))); if (/password/i.test(authErr(error))) pw.select(); }
  });
  setTimeout(() => (nm || em).focus({ preventScroll: true }), 120);
}

/* ---------- Google: official button from Google Identity Services, with an OAuth-redirect fallback ---------- */
function loadGsi() {
  if (window.google && google.accounts && google.accounts.id) return Promise.resolve();
  if (gsiLoading) return gsiLoading;
  gsiLoading = new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = 'https://accounts.google.com/gsi/client'; s.async = true;
    s.onload = res; s.onerror = () => { gsiLoading = null; rej(new Error('Google sign-in could not load')); };
    document.head.appendChild(s);
  });
  return gsiLoading;
}
async function sha256hex(str) { const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str)); return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, '0')).join(''); }
async function mountGoogle() {
  const slot = $('#gsiSlot'), fb = $('#gFallback'); if (!slot || !fb) return;   // own button is always used now
  if (!CFG.googleClientId) return;
  try {
    await Promise.race([loadGsi(), wait(7000).then(() => { throw new Error('Google sign-in timed out'); })]);
    googleNonce = btoa(String.fromCharCode(...crypto.getRandomValues(new Uint8Array(32))));
    const hashed = await sha256hex(googleNonce);
    google.accounts.id.initialize({ client_id: CFG.googleClientId, callback: onGoogleCredential, nonce: hashed, ux_mode: 'popup', context: authMode === 'signup' ? 'signup' : 'signin', itp_support: true, use_fedcm_for_prompt: true });
    if (!document.contains(slot)) return;
    slot.innerHTML = '';
    google.accounts.id.renderButton(slot, { type: 'standard', theme: 'outline', size: 'large', shape: 'rectangular', logo_alignment: 'left', text: authMode === 'signup' ? 'signup_with' : 'signin_with', width: Math.round(Math.min(400, Math.max(240, slot.getBoundingClientRect().width || 400))) });
    slot.hidden = false; fb.hidden = true;
  } catch (e) { console.warn(e); slot.hidden = true; fb.hidden = false; }
}
async function onGoogleCredential(resp) {
  authAlert('');
  const { error } = await sb.auth.signInWithIdToken({ provider: 'google', token: resp.credential, nonce: googleNonce });
  if (error) { authAlert(esc(authErr(error))); mountGoogle(); }
}
async function googleRedirect(btn) {
  btn.classList.add('loading');
  const { error } = await sb.auth.signInWithOAuth({ provider: 'google', options: { redirectTo: APP_URL, queryParams: { prompt: 'select_account' } } });
  if (error) { btn.classList.remove('loading'); authAlert(esc(authErr(error))); }
}

/* ---------- One-time code by email (works with any mailbox, including company mail on Hostinger) ---------- */
function otpFlow() {
  let email = '', coolUntil = 0, step = 1;
  modal({
    title: 'Sign in with an email code', sub: 'No password needed. We email you a one-time code.',
    body: `<div data-step="1"><div class="field" id="hfEmail"><label for="hEmail">Work email</label><input class="input" id="hEmail" type="email" placeholder="you@yourcompany.com" autocomplete="email" value="${esc(($('#aEmail') || {}).value || '')}"><div class="hint">Works with any mailbox, including company email on your own domain.</div><div class="err-msg" hidden></div></div></div>
      <div data-step="2" hidden><p style="color:var(--ink2);margin-bottom:14px">Enter the 6-digit code sent to <b id="hTo"></b>. If the email contains a link instead, open it in this browser.</p>
        <div class="otp" id="otp" role="group" aria-label="Sign-in code">${Array.from({ length: 6 }, (_, i) => `<input inputmode="numeric" autocomplete="${i ? 'off' : 'one-time-code'}" maxlength="1" aria-label="Digit ${i + 1}">`).join('')}</div>
        <div class="field" id="hfOtp" style="margin:0"><div class="err-msg" hidden></div></div>
        <div class="auth-row" style="margin:14px 0 0"><button type="button" class="txt-btn" id="hBack">Use a different email</button><button type="button" class="txt-btn" id="hResend">Resend code</button></div></div>`,
    foot: `<button class="btn" data-close>Cancel</button><button class="btn btn-primary" id="hGo">Send code</button>`,
    onMount(el, close) {
      const inp = el.querySelector('#hEmail'), go_ = el.querySelector('#hGo'), boxes = $$('#otp input', el), otp = el.querySelector('#otp');
      const show = n => { step = n; $$('[data-step]', el).forEach(s => s.hidden = +s.dataset.step !== n); go_.textContent = n === 1 ? 'Send code' : 'Verify and sign in'; };
      const send = async () => {
        const v = inp.value.trim().toLowerCase();
        if (!emailOk(v)) { setFieldErr(el, 'hfEmail', 'Enter a valid email address.'); inp.focus(); return; }
        if (!domainOk(v)) { setFieldErr(el, 'hfEmail', `Use your work email (${esc(domainHint())}).`); inp.focus(); return; }
        email = v; go_.classList.add('loading');
        const { error } = await sb.auth.signInWithOtp({ email, options: { emailRedirectTo: APP_URL, shouldCreateUser: CFG.allowSignups !== false } });
        go_.classList.remove('loading');
        if (error) { if (step === 1) setFieldErr(el, 'hfEmail', esc(authErr(error))); else setFieldErr(el, 'hfOtp', esc(authErr(error))); return; }
        coolUntil = now() + 60000;
        el.querySelector('#hTo').textContent = email;
        boxes.forEach(b => b.value = ''); setFieldErr(el, 'hfOtp', ''); otp.classList.remove('err');
        show(2); boxes[0].focus();
        toast(`Code sent to ${email}`);
      };
      const verify = async () => {
        const v = boxes.map(b => b.value).join('');
        const fail = msg => { setFieldErr(el, 'hfOtp', msg); otp.classList.remove('err'); void otp.offsetWidth; otp.classList.add('err'); boxes.forEach(b => b.value = ''); boxes[0].focus(); };
        if (v.length < 6) { setFieldErr(el, 'hfOtp', 'Enter all 6 digits.'); return; }
        go_.classList.add('loading');
        const { error } = await sb.auth.verifyOtp({ email, token: v, type: 'email' });
        go_.classList.remove('loading');
        if (error) return fail(esc(authErr(error)));
        close();
      };
      boxes.forEach((b, i) => {
        b.addEventListener('input', () => { b.value = b.value.replace(/\D/g, '').slice(-1); if (b.value && i < 5) boxes[i + 1].focus(); if (boxes.every(x => x.value)) verify(); });
        b.addEventListener('keydown', e => {
          if (e.key === 'Backspace' && !b.value && i) { boxes[i - 1].focus(); boxes[i - 1].value = ''; }
          if (e.key === 'ArrowLeft' && i) boxes[i - 1].focus();
          if (e.key === 'ArrowRight' && i < 5) boxes[i + 1].focus();
          if (e.key === 'Enter') { e.preventDefault(); verify(); }
        });
        b.addEventListener('paste', e => {
          const d = (e.clipboardData.getData('text') || '').replace(/\D/g, '').slice(0, 6); if (!d) return;
          e.preventDefault(); d.split('').forEach((c, k) => { if (boxes[k]) boxes[k].value = c; });
          (boxes[d.length] || boxes[5]).focus(); if (d.length === 6) verify();
        });
      });
      inp.addEventListener('input', () => setFieldErr(el, 'hfEmail', ''));
      inp.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); send(); } });
      go_.addEventListener('click', () => step === 1 ? send() : verify());
      el.querySelector('#hBack').addEventListener('click', () => { show(1); inp.focus(); });
      el.querySelector('#hResend').addEventListener('click', () => { if (now() < coolUntil) { toast(`You can request a new code in ${Math.ceil((coolUntil - now()) / 1000)} seconds.`, { type: 'info' }); return; } send(); });
    }
  });
}

/* ---------- Password reset ---------- */
function forgotFlow() {
  modal({
    title: 'Forgot your password?', sub: 'DocBox does not send emails, so passwords are reset by your administrator.',
    body: `<p style="color:var(--ink2);line-height:1.6">Ask your DocBox administrator to set a new password for your account. They can do it from the Supabase dashboard in under a minute. Then sign in with the new password and change it in Settings.</p>`,
    foot: `<button class="btn btn-primary" data-close>OK</button>`
  });
}
function newPasswordModal() {
  modal({
    title: 'Choose a new password', sub: 'You opened a password reset link. Set your new password to continue.',
    body: `<div class="field" id="npf1"><label for="np1">New password</label><input class="input" id="np1" type="password" autocomplete="new-password" placeholder="At least 8 characters"><div class="err-msg" hidden></div></div>
      <div class="field" id="npf2"><label for="np2">Repeat password</label><input class="input" id="np2" type="password" autocomplete="new-password"><div class="err-msg" hidden></div></div>`,
    foot: `<button class="btn" data-close>Later</button><button class="btn btn-primary" id="npGo">Save password</button>`,
    onMount(el, close) {
      const go_ = el.querySelector('#npGo');
      go_.addEventListener('click', async () => {
        const a = el.querySelector('#np1').value, b = el.querySelector('#np2').value;
        setFieldErr(el, 'npf1', ''); setFieldErr(el, 'npf2', '');
        if (a.length < 8) return setFieldErr(el, 'npf1', 'Use at least 8 characters.');
        if (a !== b) return setFieldErr(el, 'npf2', 'The passwords do not match.');
        go_.classList.add('loading');
        const { error } = await sb.auth.updateUser({ password: a });
        go_.classList.remove('loading');
        if (error) return setFieldErr(el, 'npf1', esc(authErr(error)));
        close(); toast('Password updated');
      });
    }
  });
}
async function resendSignup(btn) {
  if (!authNotice) return;
  btn.classList.add('loading');
  const { error } = await sb.auth.resend({ type: 'signup', email: authNotice.email, options: { emailRedirectTo: APP_URL } });
  btn.classList.remove('loading');
  authAlert(error ? esc(authErr(error)) : 'Sent again. It can take a minute to arrive, and may land in spam.', error ? 'error' : 'info');
}
document.addEventListener('click', e => {
  const b = e.target.closest('[data-auth]'); if (!b) return;
  const a = b.dataset.auth;
  if (a === 'to-signup' || a === 'to-signin') { authMode = a === 'to-signup' ? 'signup' : 'signin'; authNotice = null; lock(); }
  else if (a === 'peek') { const i = $('#aPw'), show = i.type === 'password'; i.type = show ? 'text' : 'password'; b.innerHTML = ico(show ? 'eyeOff' : 'eye'); b.setAttribute('aria-label', show ? 'Hide password' : 'Show password'); }
  else if (a === 'forgot') forgotFlow();
  else if (a === 'google') googleRedirect(b);
  else if (a === 'otp') otpFlow();
  else if (a === 'resend') resendSignup(b);
});

/* ---------- session lifecycle ---------- */
async function onAuth(event, s) {
  if (event === 'PASSWORD_RECOVERY') setTimeout(newPasswordModal, 400);
  const next = sessionFrom(s);
  if (!next) {
    session = null; loaded = false; state.sections = []; state.documents = []; textCache.clear();
    if ($('#auth').hidden || document.body.classList.contains('booting')) lock();
    return;
  }
  if (session && session.uid === next.uid) { Object.assign(session, next); if (loaded || event === 'TOKEN_REFRESHED' || event === 'USER_UPDATED') return; }
  if (!domainOk(next.email)) {
    pendingAuthError = `This account (${next.email}) is not a work email. Sign in with ${domainHint()}.`;
    await sb.auth.signOut({ scope: 'local' }); return;
  }
  session = next; authNotice = null;
  loadUi(session.uid);
  if (!state.settings.user) state.settings.user = session.name;
  applyMotionPrefs(); cursor.sync(); bg.start();
  if (event === 'SIGNED_IN') log(`Signed in with ${PROVIDERS[session.provider] || session.provider}`, 'lock');
  saveNow();
  await loadLibrary(event === 'SIGNED_IN');
}
let loadingLib = false;
async function loadLibrary(greet) {
  if (loadingLib) return; loadingLib = true;
  showApp(); loaded = false;
  route = parseHash(); renderSidebar(); $('#view').innerHTML = skeletonHome();
  try {
    await api.load();
    state.profile = await api.loadProfile().catch(e => { console.warn('profile', e); return null; });
    if (state.profile && state.profile.name) state.settings.user = state.profile.name;
    loaded = true;
  }
  catch (e) {
    console.error(e);
    const missing = /relation .* does not exist|schema cache|could not find the table/i.test(String(e && e.message));
    $('#view').innerHTML = empty({ kind: 'search', title: 'Unable to load your library', text: missing ? 'The DocBox tables were not found. Run setup.sql in the Supabase SQL Editor, then try again.' : esc(friendly(e) || 'The DocBox database did not respond.'), actions: `<button class="btn btn-primary" data-act="retry-load">${ico('restore')}Try again</button><button class="btn" data-act="sign-out">${ico('logout')}Log out</button>` });
    observeReveal($('#view'), true);
    loadingLib = false; return;
  }
  loadingLib = false;
  render(true);
  if (greet) toast(`Signed in as ${session.email}`);
}

/* =========================================================
   Boot
   ========================================================= */
$('.brand').insertAdjacentHTML('afterbegin', LOGO());
$('#splashLogo').innerHTML = LOGO('splash-mark');
try { $('#favicon').href = 'data:image/svg+xml,' + encodeURIComponent(LOGO('m', true).replace('<svg ', '<svg xmlns="http://www.w3.org/2000/svg" ')); } catch (e) { /* noop */ }
mqReduce.addEventListener && mqReduce.addEventListener('change', () => { bg.start(); cursor.sync(); });
applyMotionPrefs(); bg.start(); updateBell();
route = parseHash();
(async () => {
  if (!configured()) { lock(); return; }
  if (!initSupabase()) { setupError = 'The Supabase library could not be loaded. Check your internet connection and reload.'; lock(); return; }
  const qp = new URLSearchParams(location.search), hp = new URLSearchParams(location.hash.replace(/^#\/?/, '').split('?').pop());
  const err = qp.get('error_description') || hp.get('error_description');
  if (err) pendingAuthError = err.replace(/\+/g, ' ');
  if (err || /access_token|error=/.test(location.hash)) history.replaceState(null, '', location.pathname + '#/home');
  try { if (localStorage.getItem('docbox.ephemeral') && !sessionStorage.getItem('docbox.alive')) { localStorage.removeItem('docbox.ephemeral'); await sb.auth.signOut({ scope: 'local' }); } } catch (x) { /* noop */ }
  sb.auth.onAuthStateChange((ev, s) => { setTimeout(() => onAuth(ev, s), 0); });
  setTimeout(() => { if (document.body.classList.contains('booting')) { setupError = 'DocBox could not reach Supabase. Check the Project URL and your connection.'; lock(); } }, 15000);
})();
})();
